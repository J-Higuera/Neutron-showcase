<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Frondosa is a production-feeling demo ecommerce nursery for matching houseplants to real homes."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%2328583b' d='M31 57C19 47 12 36 13 25c1-10 9-17 19-18 10 1 18 8 19 18 1 11-6 22-18 32h-2Z'/%3E%3Cpath fill='%23f5efdf' d='M32 52c-2-16 1-29 10-39-13 7-18 20-10 39Z'/%3E%3C/svg%3E" />
    <title>Frondosa Nursery Shop</title>
    <script type="module">
      const routeBase = (() => {
        const marker = 'frondosa-nursery-shop';
        const parts = location.pathname.split('/').filter(Boolean);
        const markerIndex = parts.indexOf(marker);
        const routeParts = markerIndex >= 0 ? parts.slice(markerIndex + 1) : parts;
        if (markerIndex >= 0 && routeParts.length === 0 && !location.pathname.endsWith('/')) return './' + marker + '/';
        const depth = Math.max(0, routeParts.length - (location.pathname.endsWith('/') ? 0 : 1));
        return depth ? '../'.repeat(depth) : './';
      })();
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.crossOrigin = '';
      link.href = routeBase + 'assets/index-BuaY03dm.css';
      document.head.appendChild(link);
      import(routeBase + 'assets/index-BoswF97a.js');
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
